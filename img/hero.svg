<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <rect width="900" height="1200" fill="#237C8F"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- technical grid -->
    <g stroke-width="1.1" opacity="0.22">
      <path d="M0 150H900M0 300H900M0 450H900M0 600H900M0 750H900M0 900H900M0 1050H900"/>
      <path d="M150 0V1200M300 0V1200M450 0V1200M600 0V1200M750 0V1200"/>
    </g>

    <!-- measurement crosses -->
    <g stroke-width="2" opacity="0.5">
      <path d="M96 96v40M76 116h40"/>
      <path d="M804 1084v40M784 1104h40"/>
    </g>

    <!-- window frame, slightly rotated -->
    <g transform="rotate(-7 450 600)">
      <rect x="240" y="330" width="420" height="540" rx="6" stroke-width="7" opacity="0.95"/>
      <rect x="266" y="356" width="368" height="488" rx="3" stroke-width="3" opacity="0.55"/>
      <path d="M450 356V844" stroke-width="5" opacity="0.8"/>
      <path d="M266 600H634" stroke-width="5" opacity="0.8"/>
      <!-- silicone bead along the inner rebate -->
      <path d="M282 372q0 -14 14 -14h336q14 0 14 14v472q0 14 -14 14H296q-14 0 -14 -14z"
            stroke-width="11" opacity="0.95"/>
      <!-- sash handle -->
      <path d="M576 596h34" stroke-width="6" opacity="0.9"/>
      <circle cx="618" cy="596" r="7" stroke-width="4" opacity="0.9"/>
    </g>

    <!-- tool path: dashed arcs around the frame corner -->
    <g stroke-width="2.4" stroke-dasharray="12 14" opacity="0.85">
      <path d="M250 300a120 120 0 0 1 120 -120"/>
      <path d="M560 200a140 140 0 0 1 140 140"/>
      <path d="M740 880a130 130 0 0 1 -130 130"/>
    </g>

    <!-- nozzle head -->
    <g transform="translate(700 380)" stroke-width="4" opacity="0.95">
      <path d="M0 0h-46a26 26 0 0 0 -26 26v46"/>
      <path d="M-72 78l-16 24 16 24 16 -24z" fill="#237C8F"/>
      <path d="M-86 126c0 26 18 44 40 44"/>
    </g>

    <!-- gear -->
    <g transform="translate(178 900)" stroke-width="4" opacity="0.8">
      <circle cx="0" cy="0" r="34"/>
      <circle cx="0" cy="0" r="13"/>
      <g stroke-width="7">
        <path d="M0 -48v-14M0 48v14M-48 0h-14M48 0h14"/>
        <path d="M-34 -34l-10 -10M34 34l10 10M-34 34l-10 10M34 -34l10 -10"/>
      </g>
    </g>

    <!-- corner ticks -->
    <g stroke-width="4" opacity="0.9">
      <path d="M60 60h70M60 60v70"/>
      <path d="M840 1140h-70M840 1140v-70"/>
    </g>
  </g>

</svg>
